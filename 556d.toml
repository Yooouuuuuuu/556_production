# 556d configuration - only what is the same on every machine; paths are relative to this file.
# Model connections, the embedder and the timezone are NOT here: they live in home/models.json (ignored),
# set in the app under 設定 → 全域 → 模型連線. A character does not start until they are set.

[daemon]
port = 55600

[hermes]
home = "home"
exe  = "vendor/hermes-agent/.venv/Scripts/hermes.exe"
# each companion is ONE process: her `hermes gateway run` (API server for the app + her channels);
# the API port is picked per start, or set API_SERVER_PORT in her .env

[shim]
port = 55601                      # her config.yaml points at this; the shim forwards to the chat connection
timeout_seconds = 600
